<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>stage</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #111114; --muted: #7D7690; --pink: #FF2D78; --purple: #7B5CFF; --mint: #2BD4A8; --yellow: #FFC93C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #fff; font-family: "Poppins", system-ui, sans-serif; color: var(--ink); }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; will-change: transform; }
  .b1 { width: 560px; height: 560px; left: -160px; top: -120px; background: var(--pink); animation: drift1 16s ease-in-out infinite; }
  .b2 { width: 620px; height: 620px; right: -220px; top: 260px; background: var(--purple); animation: drift2 19s ease-in-out infinite; }
  .b3 { width: 520px; height: 520px; left: 120px; bottom: -220px; background: var(--mint); animation: drift3 17s ease-in-out infinite; }
  .b4 { width: 300px; height: 300px; right: 80px; bottom: 120px; background: var(--yellow); opacity: 0.4; animation: drift1 14s ease-in-out infinite reverse; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px, 40px) scale(1.08); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-70px, 50px) scale(1.06); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px, -60px) scale(1.1); } }
  .veil { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.35), rgba(255,255,255,0.7) 70%); }

  .copy { position: absolute; left: 0; right: 0; top: 150px; text-align: center; padding: 0 80px; }
  .copy h1 { margin: 0; font-size: 78px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; }
  .copy p { margin: 18px 0 0; font-size: 31px; font-weight: 500; color: var(--muted); line-height: 1.35; }
  .copy .line { display: block; opacity: 0; transform: translateY(18px); transition: opacity 0.55s cubic-bezier(.2,.8,.2,1), transform 0.55s cubic-bezier(.2,.8,.2,1); }
  .copy .line.in { opacity: 1; transform: none; }
  .copy .line.out { opacity: 0; transform: translateY(-14px); transition-duration: 0.35s; }
  .copy h1 .hl { background: linear-gradient(120deg, var(--pink), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .stage { position: absolute; left: 50%; top: 400px; transform: translateX(-50%) scale(1.42); transform-origin: top center; }
  .phone {
    position: relative; width: 410px; height: 864px; border-radius: 64px; background: #0e0e11;
    box-shadow: 0 50px 90px rgba(20, 20, 30, 0.30), 0 12px 30px rgba(20,20,30,0.18), inset 0 0 0 2px #2a2a2f, inset 0 0 0 4px #0e0e11;
    opacity: 0; transform: translateY(160px) scale(0.9);
    transition: opacity 0.9s cubic-bezier(.2,.8,.2,1), transform 1.1s cubic-bezier(.34,1.3,.64,1);
  }
  .phone.in { opacity: 1; transform: none; animation: float 5s ease-in-out 1.2s infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .phone::before, .phone::after { content: ""; position: absolute; background: #1a1a1f; border-radius: 3px; }
  .phone::before { left: -4px; top: 170px; width: 4px; height: 96px; box-shadow: 0 130px 0 #1a1a1f; }
  .phone::after { right: -4px; top: 230px; width: 4px; height: 120px; }
  .screen { position: absolute; left: 10px; top: 10px; width: 390px; height: 844px; border-radius: 54px; overflow: hidden; background: #fff; }
  .screen iframe { border: 0; width: 390px; height: 844px; display: block; }
  .island { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); width: 122px; height: 36px; border-radius: 22px; background: #0e0e11; z-index: 3; }
  .topfade { position: absolute; left: 0; right: 0; top: 0; height: 62px; background: linear-gradient(#fff 58%, rgba(255,255,255,0)); z-index: 1; pointer-events: none; }
  .statusbar { position: absolute; top: 18px; left: 34px; right: 34px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600; z-index: 2; pointer-events: none; color: var(--ink); }
  .statusbar .right { display: flex; gap: 6px; align-items: center; }
  .statusbar svg { height: 12px; }
  .homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(17,17,20,0.85); z-index: 3; }
  .cursor { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: rgba(47,125,246,0.28); border: 2px solid rgba(47,125,246,0.7); transform: translate(-50%,-50%) scale(0); opacity: 0; z-index: 5; pointer-events: none; transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease; }
  .cursor.show { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  .badge { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); opacity: 0; font-size: 30px; font-weight: 600; color: var(--muted); transition: opacity 0.6s ease, transform 0.6s cubic-bezier(.2,.8,.2,1); }
  .b2 { top: 520px; }
  .b3 { bottom: -160px; left: 60px; }
  .b4 { bottom: 380px; }
  .badge.in { opacity: 1; transform: translateX(-50%); }
  .badge b { color: var(--ink); }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="veil"></div>

  <div class="copy">
    <h1><span class="line" id="h1a"></span></h1>
    <p><span class="line" id="h1b"></span></p>
  </div>

  <div class="stage">
    <div class="phone" id="phone">
      <div class="screen">
        <iframe id="app" src="/" title="app"></iframe>
        <div class="topfade"></div>
        <div class="statusbar"><span>9:41</span><span class="right">
          <svg viewBox="0 0 20 12" width="18"><rect x="0" y="8" width="3" height="4" rx="1" fill="#111"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#111"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#111"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#111"/></svg>
          <svg viewBox="0 0 16 12" width="16"><path d="M8 11.5 1.5 5a9.2 9.2 0 0 1 13 0z" fill="#111"/></svg>
          <svg viewBox="0 0 28 12" width="26"><rect x="0.5" y="0.5" width="23" height="11" rx="3" fill="none" stroke="#111"/><rect x="2" y="2" width="20" height="8" rx="2" fill="#111"/><rect x="25" y="4" width="2.5" height="4" rx="1" fill="#111"/></svg>
        </span></div>
        <div class="island"></div>
        <div class="homebar"></div>
        <div class="cursor" id="cursor"></div>
      </div>
    </div>
  </div>

  <div class="badge" id="badge">No account. <b>Just go.</b></div>

<script>
  const $ = (id) => document.getElementById(id);
  const app = () => $("app").contentWindow;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  window.setCopy = (title, sub) => {
    const a = $("h1a"), b = $("h1b");
    a.classList.remove("in"); b.classList.remove("in"); a.classList.add("out"); b.classList.add("out");
    setTimeout(() => {
      a.innerHTML = title; b.textContent = sub;
      a.classList.remove("out"); b.classList.remove("out");
      void a.offsetWidth;
      a.classList.add("in"); setTimeout(() => b.classList.add("in"), 120);
    }, 360);
  };
  window.phoneIn = () => $("phone").classList.add("in");
  window.badgeIn = () => $("badge").classList.add("in");

  // The app is a web page with no notch to dodge; inside the phone frame it
  // needs an iOS-style safe area so the greeting clears the island and the
  // pill nav clears the home bar.
  const SAFE_TOP = 58;
  $("app").addEventListener("load", () => {
    try {
      const d = app().document;
      const s = d.createElement("style");
      // scroll-behavior:auto so the app's own smooth scrolling does not restart on every scripted frame
      s.textContent = `html{scroll-behavior:auto !important} body{padding-top:${SAFE_TOP}px !important;padding-bottom:140px !important} .navwrap{bottom:34px !important}`;
      d.head.appendChild(s);
    } catch {}
  });
  window.appReady = () => {
    try { return app().document.querySelectorAll("#listNear .hc, #listMonth .hc").length > 0 && app().document.querySelectorAll("#listPerks .hc").length > 0; } catch { return false; }
  };
  window.appTop = (id) => { const el = app().document.getElementById(id); return el ? el.getBoundingClientRect().top + app().scrollY - SAFE_TOP - 14 : 0; };

  // Scripted scrolls with our own easing, so the recording has a steady, deliberate pace.
  window.scrollApp = (y, ms) => new Promise((res) => {
    const w = app(); const from = w.scrollY; const t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / ms); w.scrollTo(0, from + (y - from) * ease(k)); if (k < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
  window.scrollRail = (x, ms) => new Promise((res) => {
    const el = app().document.getElementById("railSoon"); if (!el) return res();
    const from = el.scrollLeft; const t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / ms); el.scrollLeft = from + (x - from) * ease(k); if (k < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
  window.tapEl = async (selector) => {
    const el = app().document.querySelector(selector); if (!el) return false;
    const r = el.getBoundingClientRect(); const c = $("cursor");
    c.style.left = (r.left + r.width / 2) + "px"; c.style.top = (r.top + r.height / 2) + "px";
    c.classList.add("show"); await new Promise((r) => setTimeout(r, 260));
    el.click(); await new Promise((r) => setTimeout(r, 220)); c.classList.remove("show");
    return true;
  };
</script>
</body>
</html>
